services:
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: arsip-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=arsipsearch2024
    volumes:
      - ./meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - arsip-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: arsip-api
    ports:
      - "8888:8888"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - type: bind
        source: /home/arsip/nas-media
        target: /pdfs
        bind:
          propagation: rslave
    restart: unless-stopped
    depends_on:
      - meilisearch
    networks:
      - arsip-network

  restart-api:
    build:
      context: ./restart-api
      dockerfile: Dockerfile
    container_name: arsip-restart-api
    environment:
      - TARGET_CONTAINER=arsip-api
      - CHECK_INTERVAL=1800
      - RETRY_INTERVAL=30
      - COMPOSE_FILE=/app/docker-compose.yml
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-arsip-search}
      - COMPOSE_SERVICE=api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    restart: unless-stopped
    networks:
      - arsip-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arsip-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://arsip-api:8888
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - arsip-network

networks:
  arsip-network:
    driver: bridge
