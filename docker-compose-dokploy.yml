services:
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: arsip-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-arsipsearch2024}
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - dokploy-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: arsip-api:latest
    container_name: arsip-api
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_KEY=${MEILI_MASTER_KEY:-arsipsearch2024}
      - DB_HOST=${DB_HOST:-mysql-arsip}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
      - DB_NAME=${DB_NAME:-arsipserverdb2}
      - PDF_BASE_PATH=${PDF_BASE_PATH:-/pdfs}
    volumes:
      - type: bind
        source: ${PDF_HOST_PATH:-/home/arsip/nas-media}
        target: /pdfs
        bind:
          propagation: rslave
    restart: unless-stopped
    depends_on:
      - meilisearch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dokploy-network

  restart-api:
    build:
      context: ./restart-api
      dockerfile: Dockerfile
    container_name: arsip-restart-api
    environment:
      - TARGET_CONTAINER=arsip-api
      - CHECK_INTERVAL=1800
      - RETRY_INTERVAL=30
      # docker run config (primary recreate method)
      - TARGET_IMAGE=arsip-api:latest
      - TARGET_NETWORK=dokploy-network
      - TARGET_ENV_VARS=MEILI_URL=http://meilisearch:7700,MEILI_KEY=${MEILI_MASTER_KEY:-arsipsearch2024},DB_HOST=${DB_HOST:-mysql-arsip},DB_PORT=${DB_PORT:-3306},DB_USER=${DB_USER:-root},DB_PASSWORD=${DB_PASSWORD:-root123},DB_NAME=${DB_NAME:-arsipserverdb2},PDF_BASE_PATH=${PDF_BASE_PATH:-/pdfs}
      - TARGET_VOLUMES=${PDF_HOST_PATH:-/home/arsip/nas-media}:/pdfs:rslave
      - TARGET_RESTART_POLICY=unless-stopped
      # docker compose config (fallback)
      - COMPOSE_FILE=/project/docker-compose-dokploy.yml
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-arsip-search}
      - COMPOSE_SERVICE=api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
    restart: unless-stopped
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arsip-frontend
    ports:
      - "8007:8007"
    environment:
      - NEXT_PUBLIC_API_URL=http://arsip-api:8888
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  meilisearch_data:
    driver: local
